<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ohme Historical Sites Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>
                <svg class="ohme-logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <path d="M50 10 C30 10, 15 25, 15 45 C15 55, 20 63, 28 68 L35 63 C30 59, 25 52, 25 45 C25 31, 35 20, 50 20 C65 20, 75 31, 75 45 C75 52, 70 59, 65 63 L72 68 C80 63, 85 55, 85 45 C85 25, 70 10, 50 10 Z M50 35 C42 35, 35 42, 35 50 L45 50 C45 47, 47 45, 50 45 C53 45, 55 47, 55 50 L65 50 C65 42, 58 35, 50 35 Z" fill="currentColor"/>
                </svg>
                hme Historical Sites
            </h1>
            <p class="subtitle">Data Management Dashboard</p>
        </header>

        <!-- Controls -->
        <div class="controls">
            <div class="file-controls">
                <label for="csvFileInput" class="btn btn-secondary">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="17 8 12 3 7 8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                    Upload CSV
                </label>
                <input type="file" id="csvFileInput" accept=".csv" style="display: none;">

                <button id="downloadBtn" class="btn btn-primary">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-15"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                    Download CSV
                </button>

                <button id="saveBtn" class="btn btn-accent">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                        <polyline points="17 21 17 13 7 13 7 21"></polyline>
                        <polyline points="7 3 7 8 15 8"></polyline>
                    </svg>
                    Save Changes
                </button>
            </div>
        </div>

        <!-- Main Content: Two Sections -->
        <div class="main-content">
            <!-- Left Section: Sites by Country Table -->
            <section class="section left-section">
                <div class="section-header">
                    <h2>Sites by Country</h2>
                    <p class="section-description">Historical site counts across regions</p>
                </div>
                <div class="table-container">
                    <table id="sitesTable" class="data-table">
                        <thead>
                            <tr id="tableHeader">
                                <!-- Dynamically generated -->
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <!-- Dynamically generated -->
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- Right Section: Yearly Trends Chart -->
            <section class="section right-section">
                <div class="section-header">
                    <div class="header-content">
                        <div>
                            <h2>Historical Trends</h2>
                            <p class="section-description">Year-over-year growth analysis</p>
                        </div>
                        <div class="country-selector-wrapper">
                            <label for="countrySelector">View:</label>
                            <select id="countrySelector" class="country-selector">
                                <option value="Global">Global</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="chart-container">
                    <canvas id="trendsChart"></canvas>
                </div>
                <div class="stats-summary" id="statsSummary">
                    <!-- Dynamically generated stats -->
                </div>
            </section>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <p>&copy; 2026 Ohme. All rights reserved.</p>
        </footer>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <script src="app.js"></script>
</body>
</html>
